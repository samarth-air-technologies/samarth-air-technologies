name: Checking Code

on:
  push: 
    branches: 
    - main

jobs: 
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code 
        uses:  actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci  

      - name: Run Eslint
        run : npm run lint

      - name: Build Projects
        run: npm run build
